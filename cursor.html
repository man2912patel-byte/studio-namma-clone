<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #cursor{
            height: 50px;
            width: 50px;
            background-color:brown;
            border-radius: 50%;
            left: 0px;
            right: 0px;
            pointer-events: none;
            position: fixed;
            z-index: 999;
        }
        #first{
            height: 100vh;
            background-color:chartreuse;
        }
        #second{
            height: 100vh;
            background-color:blue;
        }
        #videocursor{
            height: 100vh;
            width: 100vh;
            border-radius: 50%;
            left: 0px;
            right: 0px;
            pointer-events: none;
            position: fixed;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="cursor"></div>
    <div id="videocursor">
        <iframe
      src="https://player.vimeo.com/video/1127104834?background=1&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479&amp;autoplay=1&amp;muted=1&amp;loop=1"
      frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
      referrerpolicy="strict-origin-when-cross-origin" title="Showreel_Namma_EN" data-ready="true">
    </iframe>
    </div>
    <section class="content" id="first"></section>
    <section class="content" id="second"></section>
    
</body>
<script>
    let cursor= document.getElementById("cursor")
    let videocursor=document.getElementById("videocursor")
    let contents=document.querySelectorAll(".content")
    console.log(contents)
    contents.forEach((content,index)=>{
        content.addEventListener("mousemove",(event)=>{
        if(index==0){
            videocursor.style.left  = `${event.clientX}px`
            videocursor.style.top = `${event.clientY}px`
            videocursor.style.display="block"
            cursor.style.display="none"
        }
        else{
            cursor.style.left  = `${event.clientX}px`
            cursor.style.top = `${event.clientY}px`
            videocursor.style.display="none"
            cursor.style.display="block"
        }
    })
})
     
</script>
</html>
