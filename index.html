<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="nav.css">
  <style>

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      border: 3px solid black;
      font-size: 250%;
    }

    .animate {
      transform: rotateX(90deg);
      transition-duration: 1s;
      transform-origin: bottom;
      text-align: center;
    }

    .animate.show {
      transform: rotateX(0deg);
    }

    .content>iframe {
      width: 100%;
      height: 100%;
    }

    .slideImage{
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      overflow: hidden;
    }
    .slideImage > div > img{
      width: 100%;
    }

    .left{
      transform: translateX(-50%) translateY(40%) rotateZ(-20deg);
      transition-duration: 0.5s;
    }
    .right{
      transform: translateX(50%) translateY(40%) rotateZ(20deg);
      transition-duration: 0.5s;
    }

    .slideImage > .show > img{
      transform: translateX(0);
    }
  </style>
</head>

<body>
  <section class="content">
    <h1 class="animate">WE THINK</h1>
    <h1 class="animate">CRAFT AND</h1>
    <h1 class="animate">DESIGN</h1>
  </section>

  <section class="content">
    <iframe
      src="https://player.vimeo.com/video/1127104834?background=1&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479&amp;autoplay=1&amp;muted=1&amp;loop=1"
      frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
      referrerpolicy="strict-origin-when-cross-origin" title="Showreel_Namma_EN" data-ready="true">
    </iframe>
  </section>

  <section class="content">
    <p>Creative studio building premium Brands</p>
    <h2 class="animate">It’s never “just a website.”
      Every detail matters.
      We craft digital experiences.
      Your design. Our obsession.
      Your brand. Our playground.</h2>
  </section>

  <section class="content">
    <h1 class="animate">PLAYGROUND</h1>
  </section>


  <section class="slideImage">
    <div>
      <img class="left" src="https://cdn.prod.website-files.com/67aca0c732855fc2a1f2c4fc/68beb68ead192a24f9ad4372_silvr%20case%20cover%20(1).webp" alt="">
    </div>
    <div>
      <img class="right" src="https://cdn.prod.website-files.com/67aca0c732855fc2a1f2c4fc/68beb68ead192a24f9ad4372_silvr%20case%20cover%20(1).webp" alt="">
    </div>
    <div>
      <img class="left" src="https://cdn.prod.website-files.com/67aca0c732855fc2a1f2c4fc/68beb68ead192a24f9ad4372_silvr%20case%20cover%20(1).webp" alt="">
    </div>
    <div>
      <img class="right" src="https://cdn.prod.website-files.com/67aca0c732855fc2a1f2c4fc/68beb68ead192a24f9ad4372_silvr%20case%20cover%20(1).webp" alt="">
    </div>
  </section>


  <section class="content art">
    <h1 class="animate">ART DIRECTION</h1>
    <h1 class="animate">BRANDING</h1>
    <h1 class="animate">WEBFLOW</h1>
  </section>
</body>
<script src="/nav (1).js">
</script>

<script>
  let texts = document.querySelectorAll(".content > .animate");
  console.log(texts);


  let observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting == true) {
        entry.target.classList.add("show")
      }
      else {
        entry.target.classList.remove("show")
      }
    })
  })

  texts.forEach((text) => {
    observer.observe(text);
  })


  let observer2 = new IntersectionObserver((entries) =>{
    entries.forEach((entry)=>{
      if(entry.isIntersecting == true){
        entry.target.classList.add("show")
        
      }
      // else{
      //   entry.target.classList.remove("show")
      // }
    })
  })

  let images = document.querySelectorAll(".slideImage > div");

  images.forEach((img)=>{
    observer2.observe(img)
  })


  let list = document.querySelectorAll(".art > h1");

  list.forEach((element)=>{
    element.addEventListener("mouseenter",(event)=>{
      console.log(event.target)
      list.forEach((text)=>{
        if(text.innerText == event.target.innerText){
          text.style.color = "black"
        }
        else{
          text.style.color = "gray"
        }
      })
    })
  })

</script>

</html>
